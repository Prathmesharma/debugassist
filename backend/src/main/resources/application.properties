spring.application.name=debugassist
server.port=8080

# Database - set these as environment variables on Render
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/debugassist}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS - set CORS_ALLOWED_ORIGINS on Render to your Vercel URL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# AI Configuration - set GEMINI_API_KEY as environment variable on Render
# Get your free key at: https://aistudio.google.com/app/apikey
ai.provider=${AI_PROVIDER:gemini}
ai.gemini.api-key=${GEMINI_API_KEY:YOUR_KEY_HERE}
ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
ai.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# Log Analysis
analysis.max-log-size-mb=${MAX_LOG_SIZE_MB:20}
analysis.max-excerpt-lines=${MAX_EXCERPT_LINES:300}
analysis.context-lines=${CONTEXT_LINES:5}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
